# Wajib: seluruh dependency AndroidX (Compose, Hilt, Room, dst) butuh ini.
android.useAndroidX=true

# Setiap modul dapat namespace R class sendiri (praktik modern, hindari
# konflik resource antar modul).
android.nonTransitiveRClass=true

# Build lebih cepat di CI (paralel antar modul independen).
org.gradle.parallel=true
org.gradle.caching=true

# Cukup untuk project multi-modul ukuran ini tanpa boros memory runner CI.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Kotlin code style resmi JetBrains.
kotlin.code.style=official
