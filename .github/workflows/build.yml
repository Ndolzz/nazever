name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

# Hanya izinkan job baca repo — tidak perlu izin tulis untuk sekadar build.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # SUPABASE_URL dan SUPABASE_ANON_KEY diambil dari GitHub Secrets
    # (Settings > Secrets and variables > Actions), TIDAK pernah ditulis
    # di file ini. app/build.gradle.kts sudah otomatis fallback ke
    # environment variable ini kalau local.properties tidak ada
    # (lihat fungsi `secret()` di app/build.gradle.kts).
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      # Project ini belum menyertakan Gradle Wrapper (gradlew) di repo,
      # jadi Gradle diinstal langsung oleh action di bawah ini.
      # TODO(phase setup-lanjutan): commit gradlew resmi begitu ada akses
      # network di mesin dev (jalankan `gradle wrapper --gradle-version 8.10.2`),
      # supaya build lokal (Termux/Android Studio) tidak butuh Gradle terinstal manual.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nazever-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
