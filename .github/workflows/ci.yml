name: CI

# TASK-002 (NFR-04): build, test, lint pipeline for NazeVer.
# NOTE: gradle/wrapper/gradle-wrapper.jar is a binary that could not be committed via
# the available tooling, so it is regenerated in the clean environment by gradle
# wrapper (authoritative source: gradle/wrapper/gradle-wrapper.properties, Gradle 8.7).
# NOTE: the Android SDK is preinstalled on GitHub-hosted ubuntu-latest runners
# (ANDROID_HOME is set and licenses accepted), so no SDK setup step is needed.
# TASK-007: gradle output is tee-ed to log files and surfaced as annotations on
# failure so compile/test errors are visible without log download access.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.7

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee gradle-test.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee gradle-lint.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Surface Gradle errors
        if: failure()
        shell: bash
        run: |
          for log in gradle-test.log gradle-lint.log gradle-assemble.log; do
            if [ -f "$log" ]; then
              echo "=== compile/build errors ==="
              grep -E "^e: |error: |FAILURE: |What went wrong|Execution failed|Caused by:|Compilation error" "$log" | head -40 | while IFS= read -r line; do
                printf '::error file=%s::%s\n' "$log" "${line:0:240}" || true
              done
              echo "=== failed tests ==="
              grep -E " FAILED" "$log" | sort -u | head -8 | while IFS= read -r line; do
                printf '::error file=%s::FAILED TEST %s\n' "$log" "${line:0:220}" || true
              done
              echo "=== first assertion error ==="
              grep -E "AssertionError|ComparisonFailure|AssertError" "$log" | head -2 | while IFS= read -r line; do
                printf '::error file=%s::%s\n' "$log" "${line:0:240}" || true
              done
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/testDebugUnitTest/*.xml'
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-tests*/**'
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
