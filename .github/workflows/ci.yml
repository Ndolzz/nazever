name: CI

# TASK-002 (NFR-04): build, test, lint pipeline for NazeVer.
# NOTE: gradle/wrapper/gradle-wrapper.jar is a binary that could not be committed via
# the available tooling, so it is regenerated in the clean environment by 'gradle
# wrapper' (authoritative source: gradle/wrapper/gradle-wrapper.properties, Gradle 8.7).
# NOTE: the Android SDK is preinstalled on GitHub-hosted ubuntu-latest runners
# (ANDROID_HOME is set and licenses accepted), so no SDK setup step is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.7

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/testDebugUnitTest/*.xml'
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-tests*/**'
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/d
ebug/*.apk
          if-no-files-found: error
